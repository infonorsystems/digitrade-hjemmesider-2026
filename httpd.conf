# Apache HTTPD 2.4.53 - Konfigurasjon for Digitrade hjemmesider
# Plasser denne filen i Apache sin konfigurasjonsmappe og tilpass eventuelt etter behov

ServerTokens Prod
ServerSignature Off

# Lytt på både HTTP og HTTPS
Listen 10.151.81.102:80
Listen 10.151.81.102:443

# Last inn nødvendige moduler
LoadModule ssl_module modules/mod_ssl.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule headers_module modules/mod_headers.so
LoadModule mime_module modules/mod_mime.so

# Rotmappe for nettstedet
DocumentRoot "/www/http_ins/htdocs"
<Directory "/www/http_ins/htdocs">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    <LimitExcept GET HEAD>
        Require all denied
    </LimitExcept>
</Directory>

DirectoryIndex index.html
# MIME-type for vanlige webfiler
AddType text/html .html
AddType text/css .css
AddType application/javascript .js
AddType image/svg+xml .svg
AddType image/png .png
AddType image/jpeg .jpg .jpeg
AddType image/webp .webp

# Tving www til ikke-www (eller motsatt, her ikke-www)
<VirtualHost 10.151.81.102:80>
    ServerName infonorsystems.no
    ServerAlias www.infonorsystems.no, digitrade.no, www.digitrade.no, digitrade.net, www.digitrade.net
    DocumentRoot "/www/http_ins/htdocs"

    RewriteEngine On
    # Redirect www to non-www
    RewriteCond %{HTTP_HOST} ^www\.(.*)$ [NC]
    RewriteRule ^(.*)$ http://%1/$1 [R=301,L]

    # Redirect HTTP to HTTPS
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

    ErrorLog logs/error.log
    CustomLog logs/access.log combined
</VirtualHost>

<VirtualHost 10.151.81.102:443>
    ServerName infonorsystems.no
    ServerAlias www.infonorsystems.no, digitrade.no, www.digitrade.no, digitrade.net, www.digitrade.net
    DocumentRoot "/www/http_ins/htdocs"

    SSLEngine on
    SSLCertificateFile    /path/to/cert.pem
    SSLCertificateKeyFile /path/to/privkey.pem
    #SSLCertificateChainFile /path/to/chain.pem

    RewriteEngine On
    # Redirect www to non-www
    RewriteCond %{HTTP_HOST} ^www\.(.*)$ [NC]
    RewriteRule ^(.*)$ https://%1/$1 [R=301,L]

    <Directory "/www/http_ins/htdocs">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        # Caching for static assets
        <FilesMatch "\.(jpg|jpeg|png|gif|webp|svg|css|js)$">
            Header set Cache-Control "max-age=31536000, public"
        </FilesMatch>
    </Directory>

    # Sikkerhetsheadere
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';"

    ErrorLog logs/ssl_error.log
    CustomLog logs/ssl_access.log combined
</VirtualHost>

# Deaktiver .htaccess
AccessFileName .htaccess
<Files ".htaccess">
    Require all denied
</Files>

# Språkstøtte (norsk og engelsk på samme domene)
AddLanguage en .en
AddLanguage no .no
LanguagePriority en no

# Slå av directory listing
<Directory "/www/http_ins/htdocs">
    Options -Indexes
</Directory>

# Slå på komprimering hvis mod_deflate er tilgjengelig
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css application/javascript application/json image/svg+xml
</IfModule>

# Slå på caching for statiske filer
<IfModule mod_expires.c>
    ExpiresActive On
    ExpiresByType image/jpg "access plus 1 year"
    ExpiresByType image/jpeg "access plus 1 year"
    ExpiresByType image/gif "access plus 1 year"
    ExpiresByType image/png "access plus 1 year"
    ExpiresByType image/webp "access plus 1 year"
    ExpiresByType text/css "access plus 1 month"
    ExpiresByType application/javascript "access plus 1 month"
</IfModule>

# Slå på CORS for API/JS hvis nødvendig
#<IfModule mod_headers.c>
#    Header set Access-Control-Allow-Origin "*"
#</IfModule>

# Tilpass ServerName og SSL-stier før bruk!
